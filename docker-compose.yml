services:
  jarvis:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      # Ollama runs on the host, not in this container.
      OLLAMA_URL: http://host.docker.internal:11434
      SEARXNG_URL: http://searxng:8080
      LAYA_URL: http://laya:8100
      # Optional: Auto's high tier is a Claude model; without a key Auto uses the medium local model.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: set both (e.g. in .env next to this file) to turn the Telegram bot on.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed on Linux; Docker Desktop has it already
    volumes:
      - jarvis-data:/app/data
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped

  # Picks the chat model for each message when the dropdown says Auto (see systemOneModel/).
  laya:
    build: ./systemOneModel
    ports:
      - "8100:8100"
    volumes:
      - laya-cache:/root/.cache/huggingface # the model downloads once, on first start
    restart: unless-stopped

volumes:
  jarvis-data:
  laya-cache:
